name: Build Sawtak APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Sawtak project
        run: |
          mkdir -p extracted
          unzip -o sawtak.zip -d extracted
          cp -a extracted/sawtak/. .

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Generate Android files
        run: flutter create --platforms=android --project-name=sawtak .

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sawtak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
