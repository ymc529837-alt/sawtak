name: Sawtak APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: استخراج مشروع صوتك
        uses: actions/checkout@v4

      - name: استخراج مشروع صوتك من ملف ZIP
        run: |
          mkdir -p extracted
          unzip -q sawtak_fixed_v2.zip -d extracted
          cp google-services.json extracted/sawtak/android/app/google-services.json
          cp -a extracted/sawtak/. .

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        flutter-version: '3.19.0'

      - name: إنشاء ملفات Android
        run: |
          flutter create --platforms=android --project-name=sawtak .

      - name: تثبيت الحزم
        run: flutter pub get

      - name: إنشاء ملف APK
        run: flutter build apk --release

      - name: تحميل ملف APK
        uses: actions/upload-artifact@v4
        with:
          name: sawtak-apk
          path: build/app/outputs/flutter-apk/app-release.apk
